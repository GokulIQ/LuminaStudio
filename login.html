<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your LuminaStudio client portal to access retouched photos, passport digital codes, and appointment history.">
  <title>Sign In | LuminaStudio Client Portal</title>

  <!-- Immediate Theme Initializer (Prevents FOUC / Dark Mode Flash) -->
  <script>
    (function() {
      try {
        var saved = window.location.protocol === 'file:' ? null : localStorage.getItem('lumina_theme');
        var theme = saved || 'light';
        var html = document.documentElement;
        html.setAttribute('data-bs-theme', theme);
        html.setAttribute('data-theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('dark-mode-pending');
      } catch(e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

<!-- use this for admin login --admin@lumina.studio /    -->

  <!-- Google Fonts, Bootstrap 5, FontAwesome, AOS -->                        
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 position-relative py-5">

  <!-- Ambient Glows -->
  <div class="ambient-glow-wrapper">
    <div class="ambient-blob blob-primary" style="top: 10%; left: 20%;"></div>
    <div class="ambient-blob blob-accent" style="bottom: 10%; right: 20%;"></div>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5" data-aos="zoom-in">
        
        <div class="glass-card p-4 p-md-5 shadow-2xl">
          
          <div class="text-center mb-4">
            <a href="index.html" class="brand-logo text-decoration-none d-inline-flex justify-content-center mb-3">
              <div class="brand-icon"><i class="fa-solid fa-camera-retro"></i></div>
              <span>Lumina<span class="accent">Studio</span></span>
            </a>
            <h1 class="h4 text-primary fw-bold">Welcome Back</h1>
            <p class="small text-muted mb-0">Sign in to manage appointments & photo sessions</p>
          </div>

          <form id="loginForm" class="needs-validation-custom" novalidate>
            
            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <div class="input-icon-group">
                <i class="fa-solid fa-envelope icon-addon"></i>
                <input type="email" id="loginEmail" class="form-control form-control-glass" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-bold mb-0">Password</label>
                <a href="faq.html" class="small text-primary text-decoration-none">Forgot password?</a>
              </div>
              <div class="input-icon-group">
                <i class="fa-solid fa-lock icon-addon"></i>
                <input type="password" id="loginPassword" class="form-control form-control-glass" placeholder="••••••••" required>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label small text-muted" for="rememberMe">
                Remember this device for 30 days
              </label>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-3 btn-shimmer mb-3">
              <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In to Account
            </button>

            <div class="text-center my-3 position-relative">
              <hr class="border-secondary border-opacity-15 my-0">
              <span class="small text-muted bg-surface px-2 position-relative" style="top: -10px; background: var(--bg-surface-glass);">or continue with</span>
            </div>

            <div class="row g-2 mb-4">
              <div class="col-6">
                <a href="index.html" class="btn btn-glass w-100 btn-sm py-2"><i class="fa-brands fa-google text-danger me-1"></i> Google</a>
              </div>
              <div class="col-6">
                <a href="index.html" class="btn btn-glass w-100 btn-sm py-2"><i class="fa-brands fa-apple text-dark me-1"></i> Apple</a>
              </div>
            </div>

            <div class="text-center small text-muted">
              Don't have an account yet? <a href="register.html" class="text-primary fw-bold text-decoration-none">Create Account</a>
            </div>

          </form>

        </div>

      </div>
    </div>
  </div>

  <!-- Floating Settings -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
