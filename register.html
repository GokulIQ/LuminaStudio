<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your LuminaStudio client account to manage your portrait proofs and download certified biometric passport photos.">
  <title>Create Account | LuminaStudio</title>

  <!-- Immediate Theme Initializer (Prevents FOUC / Dark Mode Flash) -->
  <script>
    (function() {
      try {
        var saved = window.location.protocol === 'file:' ? null : localStorage.getItem('lumina_theme');
        var theme = saved || 'light';
        var html = document.documentElement;
        html.setAttribute('data-bs-theme', theme);
        html.setAttribute('data-theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('dark-mode-pending');
      } catch(e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <!-- Google Fonts, Bootstrap 5, FontAwesome, AOS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 position-relative py-5">

  <!-- Ambient Blobs -->
  <div class="ambient-glow-wrapper">
    <div class="ambient-blob blob-primary" style="top: 10%; right: 20%;"></div>
    <div class="ambient-blob blob-secondary" style="bottom: 10%; left: 20%;"></div>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6" data-aos="zoom-in">
        
        <div class="glass-card p-4 p-md-5 shadow-2xl">
          
          <div class="text-center mb-4">
            <a href="index.html" class="brand-logo text-decoration-none d-inline-flex justify-content-center mb-3">
              <div class="brand-icon"><i class="fa-solid fa-camera-retro"></i></div>
              <span>Lumina<span class="accent">Studio</span></span>
            </a>
            <h1 class="h4 text-primary fw-bold">Create Client Account</h1>
            <p class="small text-muted mb-0">Join thousands of individuals and teams managing studio photography</p>
          </div>

          <form id="registerForm" class="needs-validation-custom" novalidate>
            
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label class="form-label small fw-bold">First Name <span class="text-danger">*</span></label>
                <input type="text" id="regFirstName" class="form-control form-control-glass" placeholder="Jane" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-bold">Last Name <span class="text-danger">*</span></label>
                <input type="text" id="regLastName" class="form-control form-control-glass" placeholder="Doe" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address <span class="text-danger">*</span></label>
              <div class="input-icon-group">
                <i class="fa-solid fa-envelope icon-addon"></i>
                <input type="email" id="regEmail" class="form-control form-control-glass" placeholder="name@company.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Phone Number (For SMS Ready Alerts) <span class="text-danger">*</span></label>
              <div class="input-icon-group">
                <i class="fa-solid fa-phone icon-addon"></i>
                <input type="tel" id="regPhone" class="form-control form-control-glass" placeholder="+1 (555) 000-0000" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Create Password <span class="text-danger">*</span></label>
              <div class="input-icon-group">
                <i class="fa-solid fa-lock icon-addon"></i>
                <input type="password" id="regPassword" class="form-control form-control-glass" placeholder="••••••••" required>
              </div>
              <!-- Real-time Password Strength Meter -->
              <div class="mt-2">
                <div class="progress" style="height: 5px; background: rgba(255,255,255,0.1);">
                  <div id="strengthBar" class="progress-bar bg-secondary" role="progressbar" style="width: 0%; transition: width 0.3s ease;"></div>
                </div>
                <div class="d-flex justify-content-between mt-1">
                  <small id="strengthLabel" class="text-muted" style="font-size: 0.75rem;">Strength: None</small>
                  <small class="text-muted" style="font-size: 0.75rem;">Min 6 chars (numbers & uppercase recommended)</small>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-icon-group">
                <i class="fa-solid fa-shield-halved icon-addon"></i>
                <input type="password" id="regConfirmPassword" class="form-control form-control-glass" placeholder="••••••••" required>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="termsCheck" required>
              <label class="form-check-label small text-muted" for="termsCheck">
                I agree to the <a href="faq.html" class="text-primary text-decoration-none">Terms of Service</a> & <a href="faq.html" class="text-primary text-decoration-none">Privacy Policy</a>
              </label>
            </div>

            <button type="submit" class="btn btn-primary-gradient w-100 py-3 btn-shimmer mb-3">
              <i class="fa-solid fa-user-plus me-2"></i> Register Account
            </button>

            <div class="text-center small text-muted">
              Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In</a>
            </div>

          </form>

        </div>

      </div>
    </div>
  </div>

  <!-- Floating Settings -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
