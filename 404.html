<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page Not Found - LuminaStudio Photography">
  <title>404 - Page Out of Focus | LuminaStudio</title>

  <!-- Immediate Theme Initializer (Prevents FOUC / Dark Mode Flash) -->
  <script>
    (function() {
      try {
        var saved = window.location.protocol === 'file:' ? null : localStorage.getItem('lumina_theme');
        var theme = saved || 'light';
        var html = document.documentElement;
        html.setAttribute('data-bs-theme', theme);
        html.setAttribute('data-theme', theme);
        if (theme === 'dark') document.documentElement.classList.add('dark-mode-pending');
      } catch(e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <!-- Google Fonts, Bootstrap 5, FontAwesome, AOS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 position-relative py-5">

  <!-- Ambient Blobs -->
  <div class="ambient-glow-wrapper">
    <div class="ambient-blob blob-primary" style="top: 20%; left: 20%;"></div>
    <div class="ambient-blob blob-accent" style="bottom: 20%; right: 20%;"></div>
  </div>

  <div class="container text-center">
    <div class="max-w-600 mx-auto" data-aos="zoom-in">
      
      <div class="mb-4 position-relative d-inline-block">
        <div class="display-1 fw-extrabold text-primary" style="font-size: 8rem; line-height: 1; letter-spacing: -2px;">404</div>
        <div class="position-absolute top-50 start-50 translate-middle">
          <i class="fa-solid fa-camera-rotate fs-1 text-secondary opacity-75"></i>
        </div>
      </div>

      <h1 class="h2 text-primary mb-2">Oops! This Frame is Out of Focus</h1>
      <p class="text-secondary mb-4">
        The page you are looking for may have been moved, renamed, or is temporarily unavailable in our studio gallery.
      </p>

      <div class="glass-card p-3 mb-4">
        <div class="input-icon-group">
          <i class="fa-solid fa-magnifying-glass icon-addon"></i>
          <input type="text" class="form-control form-control-glass" placeholder="Search our studio services or guides...">
        </div>
      </div>

      <div class="d-flex justify-content-center gap-3">
        <a href="index.html" class="btn btn-primary-gradient px-4 py-3 btn-shimmer">
          <i class="fa-solid fa-house me-2"></i> Back to Home
        </a>
        <a href="services.html" class="btn btn-glass px-4 py-3">
          <i class="fa-solid fa-camera me-2"></i> View Services
        </a>
      </div>

    </div>
  </div>

  <!-- Floating Settings -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
